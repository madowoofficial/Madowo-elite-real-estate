<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Madowo Elite | Admin</title><link rel="stylesheet" href="/styles.css"><style>
body{background:#f4f2ec}.admin-wrap{max-width:1100px;margin:45px auto;padding:0 22px}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.admin-panel{background:#fff;padding:25px;margin:22px 0;border:1px solid #e7e4dc}.admin-form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.admin-form label{display:grid;gap:6px;font-size:11px;color:#666}.admin-form input,.admin-form select,.admin-form textarea{padding:11px;border:1px solid #ddd;font:14px Arial}.admin-form .wide{grid-column:1/-1}.admin-list{width:100%;border-collapse:collapse;font-size:12px}.admin-list td,.admin-list th{padding:12px;border-bottom:1px solid #eee;text-align:left}.admin-list button{padding:7px;border:1px solid #ddd;background:#fff;cursor:pointer;margin:2px}.hidden{display:none}.login{max-width:420px;margin:80px auto;background:#fff;padding:30px}.login label{display:grid;gap:8px;margin:15px 0;font-size:12px}.login input{padding:12px;border:1px solid #ddd}.notice{font-size:12px;color:#8b6530}@media(max-width:650px){.admin-form{grid-template-columns:1fr}.admin-form .wide{grid-column:auto}.admin-list{font-size:10px}.admin-list td,.admin-list th{padding:7px}}
</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">ME</span><span><b>MADOWO ELITE</b><small>ADMINISTRATION</small></span></a><a href="/" style="color:#d2b36d;font-size:12px">View website ↗</a></header>
<div class="admin-wrap"><section class="login" id="loginBox"><p class="eyebrow">PRIVATE ADMIN AREA</p><h2 style="font-family:Georgia">Sign in</h2><form id="loginForm"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn gold" type="submit">Sign in</button><p id="loginMsg" class="notice"></p></form></section>
<div id="dashboard" class="hidden"><div class="admin-head"><div><p class="eyebrow">MANAGE YOUR BUSINESS</p><h1 style="font:38px Georgia">Dashboard</h1></div><button class="btn dark" id="logout">Sign out</button></div><section class="admin-panel"><h2 style="font:25px Georgia">Add a property</h2><form id="propertyForm" class="admin-form" enctype="multipart/form-data"><label>Property title<input name="title" required></label><label>Location<input name="location" placeholder="e.g. Kilimani, Nairobi" required></label><label>Property type<select name="type"><option>House</option><option>Apartment</option><option>Land</option><option>Commercial</option></select></label><label>Purpose<select name="purpose"><option>Sale</option><option>Rent</option></select></label><label>Price (KES)<input name="price" type="number" min="0" required></label><label>Status<select name="status"><option>Available</option><option>Sold</option><option>Rented</option></select></label><label>Bedrooms<input name="bedrooms" type="number" min="0" value="0"></label><label>Bathrooms<input name="bathrooms" type="number" min="0" value="0"></label><label>Land / floor area<input name="area" placeholder="e.g. 50 × 100 ft"></label><label>Property photo<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="wide">Description<textarea name="description" rows="3"></textarea></label><label><span><input name="featured" type="checkbox" value="1"> Feature on homepage</span></label><div><button class="btn gold" type="submit">Save property</button><p id="propertyMsg" class="notice"></p></div></form></section>
<section class="admin-panel"><h2 style="font:25px Georgia">Property listings</h2><div style="overflow:auto"><table class="admin-list"><thead><tr><th>Property</th><th>Location</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody id="propertyRows"></tbody></table></div></section>
<section class="admin-panel"><h2 style="font:25px Georgia">Customer enquiries</h2><div style="overflow:auto"><table class="admin-list"><thead><tr><th>Date</th><th>Name</th><th>Contact</th><th>Message</th><th>Property</th><th>Status</th></tr></thead><tbody id="enquiryRows"></tbody></table></div></section></div></div><script src="/admin.js"></script></body></html>
